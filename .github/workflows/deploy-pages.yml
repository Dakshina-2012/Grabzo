name: Deploy Grabzo frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_API_BASE_URL: https://grabzomktplc-cfghysvd.manus.space

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Add SPA fallback
        run: |
          cp dist/public/index.html dist/public/404.html
          # GitHub Pages serves directory index files reliably on direct loads.
          # Keep fixed application routes inside the SPA instead of returning 404.
          for route in account products vendors cart checkout orders notifications wishlist seller admin; do
            mkdir -p "dist/public/$route"
            cp dist/public/index.html "dist/public/$route/index.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
